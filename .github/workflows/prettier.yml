name: Prettier code formatter

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone --depth 1 https://github.com/chieh1005/chieh1005.github.io.git .

      - name: Install Prettier
        run: npm install -g prettier @shopify/prettier-plugin-liquid

      - name: Prettier Check
        id: prettier
        continue-on-error: true
        run: npx prettier . --check

      - name: Create diff
        if: ${{ failure() }}
        run: |
          npx prettier . --write
          git diff -- . ':(exclude)package-lock.json' ':(exclude)package.json' > diff.txt
          npm install -g diff2html-cli
          diff2html -i file -s side -F diff.html -- diff.txt

      - name: Check prettier result
        run: |
          if [ "${{ steps.prettier.outcome }}" = "failure" ]; then
            echo "Prettier check failed - code formatting issues found"
            exit 1
          else
            echo "Prettier check passed - all files properly formatted"
            exit 0
          fi
