site_name: Shang-Chieh Wang
site_url: https://chieh1005.github.io/
site_description: Graduate Student in Brain Science · Cognitive Neuroscience · fMRI & EEG
repo_name: chieh1005/chieh1005.github.io
repo_url: https://github.com/chieh1005/chieh1005.github.io

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/toggle-switch-off-outline, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle: {icon: material/toggle-switch, name: Switch to light mode}
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

plugins:
  - search

nav:
  - Home: index.md
  - CV: cv.md
  - Publications: publications.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
