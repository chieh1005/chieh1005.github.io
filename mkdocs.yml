site_name: Shang-Chieh Wang
site_description: Graduate Student in Brain Science at NYCU | Cognitive Neuroscience & Neuroimaging
site_author: Shang-Chieh Wang
site_url: https://chieh1005.github.io/

theme:
  name: material
  palette:
    - scheme: light
      primary: blue
      accent: light blue
      toggle:
        icon: material/lightbulb-outline
        name: Switch to dark mode
    - scheme: dark
      primary: blue
      accent: light blue
      toggle:
        icon: material/lightbulb
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex
  - toc:
      permalink: true

nav:
  - Home: index.md
  - About: about.md
  - CV: cv.md
  - Publications: publications.md
  - Blog: blog.md

copyright: Copyright &copy; 2025 Shang-Chieh Wang. Powered by MkDocs with Material theme.
