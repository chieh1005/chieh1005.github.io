name: Prettier code formatter

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Prettier
        run: npm install -g prettier @shopify/prettier-plugin-liquid

      - name: Prettier Check
        id: prettier
        continue-on-error: true
        run: npx prettier . --check

      - name: Create diff
        if: ${{ failure() }}
        run: |
          npx prettier . --write
          git diff -- . ':(exclude)package-lock.json' ':(exclude)package.json' > diff.txt
          npm install -g diff2html-cli
          diff2html -i file -s side -F diff.html -- diff.txt

      - name: Upload html diff
        id: artifact-upload
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: HTML Diff
          path: diff.html
          retention-days: 7

      - name: Check prettier result
        run: |
          if [ "${{ steps.prettier.outcome }}" = "failure" ]; then
            exit 1
          fi
