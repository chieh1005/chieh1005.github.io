site_name: Shang-Chieh Wang
site_url: https://chieh1005.github.io/
site_description: Graduate Student in Brain Science · Cognitive Neuroscience · fMRI & EEG
repo_name: chieh1005/chieh1005.github.io
repo_url: https://github.com/chieh1005/chieh1005.github.io

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/toggle-switch-off-outline, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle: {icon: material/toggle-switch, name: Switch to light mode}
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
    - navigation.tabs.sticky
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chieh1005
    - icon: fontawesome/solid/envelope
      link: mailto:scwang1005@gmail.com

plugins:
  - search

nav:
  - Home: index.md
  - CV: cv.md
  - Publications: publications.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
