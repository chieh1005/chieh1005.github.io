site_name: Shang-Chieh Wang
site_url: https://chieh1005.github.io/
site_description: Graduate Student in Brain Science · Cognitive Neuroscience · fMRI & EEG

theme:
  custom_dir: overrides
  name: material
  palette:
    scheme: default
    primary: blue
    accent: cyan
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
    - navigation.tabs.sticky
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/spotlight.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chieh1005
    - icon: fontawesome/solid/envelope
      link: mailto:scwang1005@gmail.com

plugins:
  - search

nav:
  - Home: index.md
  - CV: cv.md
  - Publications: publications.md
  - Teaching Materials: teaching-materials.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

